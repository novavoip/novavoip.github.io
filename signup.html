<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nova Voice</title>
    <link rel="icon" type="image/png" href="nvfav.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #242424;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            max-width: 280px;
            height: auto;
            flex: 1;
        }

        .back-button {
            background-color: #64b5f6;
            color: #1a1a1a;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
            white-space: nowrap;
        }

        .back-button:hover {
            background-color: #90caf9;
        }

        main {
            flex: 1;
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .error-message {
            display: none;
            background-color: #c62828;
            color: #fff;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #64b5f6;
        }

        .submit-button {
            background-color: #64b5f6;
            color: #1a1a1a;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .submit-button:hover {
            background-color: #90caf9;
        }

        footer {
            background-color: #242424;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #333;
            font-size: 0.9rem;
            color: #999;
        }

        footer p {
            margin: 0.5rem 0;
        }

        a {
            color: #64b5f6;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #90caf9;
        }

        /* Overlay shown when service is not available */
        #geoBlockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 2rem;
            text-align: center;
            flex-direction: column;
        }

        #geoBlockOverlay h2 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }

        #geoBlockOverlay p {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: #ddd;
        }

        #geoBlockOverlay button {
            background-color: #64b5f6;
            color: #000;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-button">← Back</a>
        <img src="novavoice.png" alt="Nova Voice Logo">
        <div style="width: 100px;"></div>
    </header>

    <main>
        <h1>Create Your Account</h1>
        <div class="error-message" id="errorMessage">
            The Nova Voice server has not been setup for accounts yet. Try again later.
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone (optional)</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <button type="submit" class="submit-button">Create Account</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 <a href="https://codeberg.org/GvYoutube">GvYoutube</a>/The Nova Voice developers</p>
    </footer>

    <!-- Overlay for blocked locations -->
    <div id="geoBlockOverlay" role="dialog" aria-modal="true" aria-hidden="true">
        <h2>Service not available in your location</h2>
        <p>Nova Voice registration is only available in the United States and Canada.</p>
        <div id="geoPlayControl"></div>
    </div>

        // Temporary error handler to show message on submit
        const form = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMessage.style.display = 'block';
        });

        // GEO-Blocking: If the user is not in US or CA, show a black overlay and play sound
        (function() {
            const overlay = document.getElementById('geoBlockOverlay');
            const playControl = document.getElementById('geoPlayControl');

            // Attempt to fetch visitor country using a public geolocation service.
            // We use ipapi.co which returns JSON like { country_code: "US", ... }
            fetch('https://ipapi.co/json/')
                .then(response => response.ok ? response.json() : Promise.reject('geo-fail'))
                .then(data => {
                    const country = (data && data.country_code) ? String(data.country_code).toUpperCase() : null;

                    if (country && country !== 'US' && country !== 'CA') {
                        // Show overlay
                        overlay.style.display = 'flex';
                        overlay.setAttribute('aria-hidden', 'false');

                        // Prevent interaction with the page
                        document.documentElement.style.backgroundColor = '#000';
                        document.body.style.backgroundColor = '#000';
                        document.body.style.overflow = 'hidden';

                        // Attempt to play the warning sound
                        const audio = new Audio('/sounds/notAvailInLocation.wav');
                        audio.loop = false;

                        audio.play().catch((err) => {
                            // Autoplay likely blocked. Provide a visible play button so user can start audio.
                            const btn = document.createElement('button');
                            btn.textContent = 'Play notice sound';
                            btn.addEventListener('click', () => {
                                audio.play().catch(() => {
                                    // ignore further errors
                                });
                            });
                            playControl.appendChild(btn);
                        });

                        // Additionally, make sure focus is on the overlay for accessibility
                        overlay.tabIndex = -1;
                        overlay.focus();
                    }
                })
                .catch(() => {
                    // If geolocation fails, do nothing (default to allowing page access)
                    // Optionally, you could block if you prefer a stricter behavior
                    console.warn('Geolocation lookup failed; allowing access by default.');
                });
        })();
    </script>
</body>
</html>
